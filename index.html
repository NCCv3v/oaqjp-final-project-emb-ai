<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d6b43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="A Hong Kong map of matcha and hojicha cafes, tasting menus, and powder tins.">
  <title>Chasen · Hong Kong matcha &amp; hojicha</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=5">
  <link rel="stylesheet" href="css/app.css?v=5">
</head>
<body>
  <div class="studio">
    <div class="desk" aria-hidden="true"></div>
    <div class="phone" id="phone">
      <header class="top">
        <div class="brand">
          <p class="eyebrow" id="eyebrow">Phone preview</p>
          <h1 id="title">Chasen</h1>
          <p class="sub" id="subtitle">Hong Kong bowls</p>
        </div>
        <div class="top-side">
          <time id="clock">–:–</time>
          <div class="langs" id="langs"></div>
        </div>
      </header>
      <main>
        <section id="view-map">
          <div class="map-stage">
            <div id="map"></div>
            <div id="atlas" class="atlas" hidden></div>
            <div class="map-overlay">
              <label class="search"><input id="map-q" type="search" enterkeyhint="search"></label>
              <div class="filters" id="filters"></div>
              <div id="route-banner" class="route-banner" hidden></div>
            </div>
            <p id="map-note" class="map-note" hidden></p>
            <div class="map-tools">
              <button type="button" id="zoom-in" data-act="zoom-in">+</button>
              <button type="button" id="zoom-out" data-act="zoom-out">−</button>
              <button type="button" id="fit-map" data-act="fit">Fit</button>
            </div>
            <div class="legend" id="legend"></div>
          </div>
        </section>
        <section id="view-cafes" hidden></section>
        <section id="view-taste" hidden></section>
        <section id="view-powder" hidden></section>
        <section id="view-book" hidden></section>
      </main>
      <div id="sheet" class="sheet" hidden></div>
      <nav class="tabbar" id="tabbar"></nav>
    </div>
  </div>
  <script src="vendor/leaflet/leaflet.js?v=5"></script>
  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
